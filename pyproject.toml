[project]
name = "personal-agent"
version = "0.1.0"
description = "Local offline voice assistant for Windows (push-to-talk, English)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "keyboard>=0.13.5",
    "pynput>=1.7.6",
    "anthropic>=0.40",
    # Tray icon. Optional at runtime — src/tray.py no-ops without them, so an
    # install that skips these still gets a working agent, just an invisible one.
    "pystray>=0.19",
    "pillow>=10",
]

[project.optional-dependencies]
# Whisper on an NVIDIA GPU. ~1.3 GB, only needed when WHISPER_DEVICE=cuda.
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[project.scripts]
personal-agent = "src.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
